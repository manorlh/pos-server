<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>R2M POS — אין חיבור</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
        background: #ffffff;
        color: #0a0a0a;
      }
      main { max-width: 22rem; padding: 1.5rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { color: #737373; margin: 0 0 1.25rem; line-height: 1.5; }
      button {
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.625rem;
        background: #171717;
        color: #fafafa;
        font: inherit;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #fafafa; }
        button { background: #e5e5e5; color: #171717; }
        p { color: #a1a1a1; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>אין חיבור לרשת</h1>
      <p>מסך הניהול זקוק לחיבור לאינטרנט. בדקו את החיבור ונסו שוב.</p>
      <button type="button" onclick="location.reload()">ניסיון חוזר</button>
    </main>
  </body>
</html>
