# Fly.io — POS Cloud API (Frankfurt, near Neon + EMQX EU)
#
# Sized for continuous evening load, not for idling (P:/specs/performance-review-2026-10.md #2):
# two shared vCPUs, two uvicorn workers per machine (Dockerfile), at least two machines always
# running (no cold start, one survives the other's deploy or crash), and Fly told how many
# requests a machine takes before it routes to the next one.
app = 'pos-cloud-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'alembic upgrade head'
  # The release's CREATE INDEX CONCURRENTLY on the larger tables (transactions) may take minutes.
  release_command_timeout = '15m'
  strategy = 'rolling'

[env]
  # Two uvicorn worker processes per machine (Dockerfile CMD).
  WEB_CONCURRENCY = '2'
  # The schema is alembic's (release_command); never create_all at start in production.
  DB_CREATE_ALL = 'false'

[http_service]
  internal_port = 8000
  force_https = true
  # Always on: a busy evening must never wait for a machine to boot.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2

  # Requests in flight per machine (2 workers): above soft_limit Fly prefers another machine,
  # at hard_limit it sends none.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 40
    hard_limit = 60

  # Routing: the process answers (no database — a database blip must not pull every machine).
  [[http_service.checks]]
    grace_period = '20s'
    interval = '15s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

# The machine reaches the database too (`SELECT 1`): checked on every machine, and waited for
# by a deploy before it moves on to the next machine.
[checks]
  [checks.ready]
    type = 'http'
    port = 8000
    method = 'GET'
    path = '/health/ready'
    grace_period = '30s'
    interval = '30s'
    timeout = '5s'

# shared-cpu-2x, 2 GB: one vCPU per worker. On 2026-10-11 the performance-1x core sat at a load
# average of 0.00–0.03 under live traffic, while the two workers held ~850 MB, so 1 GB would be too
# tight. ~$31/month for both machines in fra instead of ~$76. If Fly's CPU throttling metric
# shows up under load, go back to size = 'performance-1x'.
[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
