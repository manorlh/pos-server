<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <!--
      The Android kiosk's WebView (pos-android ui/kiosk/web): everything from the APK's own origin
      (https://appassets.androidplatform.net — the bundle, and /media/ for the kiosk's local media and
      fonts). Nothing remote: the screens never reach the network, and the WebView refuses it too.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <title>R2M POS</title>
    <style>
      html, body, #root { margin: 0; height: 100%; overflow: hidden; background: #000; }
      html { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./android/main.tsx"></script>
  </body>
</html>
